### RSA 暗号と素因数分解

<div class="simple-box">

* **RSA 暗号**: Web の HTTPS (サーバ証明書の署名) などで広く使われている
* 鍵の材料は巨大な合成数 $N = p \times q$
  * $N$ は**全世界に公開**、素因数 $p$ と $q$ は**秘密**
  * $N$ を素因数分解できれば、暗号は破れる

</div>

<br>

<div class="highlight-box">

* 安全性の根拠: 古典コンピュータで**効率よく素因数分解する方法が見つかっていない**こと
* 「不可能」と証明されたわけではない

</div>

### 古典コンピュータのゲート

<div class="simple-box">

* **ビット** (0 か 1) を**論理ゲート**で変換する
  * 例: **NAND** は「両方 1 のときだけ 0」
  * NAND を組み合わせれば、**どんな計算も作れる**

<table>
  <thead>
    <tr><th>入力 A</th><th>入力 B</th><th>A NAND B</th></tr>
  </thead>
  <tbody>
    <tr><td>0</td><td>0</td><td>1</td></tr>
    <tr><td>0</td><td>1</td><td>1</td></tr>
    <tr><td>1</td><td>0</td><td>1</td></tr>
    <tr><td>1</td><td>1</td><td>0</td></tr>
  </tbody>
</table>

</div>

<div class="highlight-box">

2 つ入れて 1 つ出す → 出力 1 から入力は**戻せない** (情報を捨てている)

</div>

### 量子コンピュータのゲート

<div class="simple-box">

* **qubit** は 0 と 1 の**重ね合わせ** $\alpha \lvert 0 \rangle + \beta \lvert 1 \rangle$ を取れる
  * $\alpha$ と $\beta$ は**振幅**。波の高さと位相のようなもの
* **量子ゲート**は振幅を回す操作
  * 例: **H ゲート**は $\lvert 0 \rangle$ を 0 と 1 が半々の重ね合わせにする

<table>
  <thead>
    <tr><th></th><th>古典</th><th>量子</th></tr>
  </thead>
  <tbody>
    <tr><td>単位</td><td>ビット (0 か 1)</td><td>qubit (重ね合わせ)</td></tr>
    <tr><td>ゲート</td><td>NAND など。入力を捨てる</td><td>H、CNOT など。逆回しできる</td></tr>
    <tr><td>読み出し</td><td>何度読んでも同じ</td><td>測ると確率的に 0 か 1</td></tr>
  </tbody>
</table>

</div>

### 測定 1 回 = 1 ショット

<div class="simple-box">

* 回路を流して測ると、0 と 1 の列が **1 本**出る。これが **1 ショット**
  * どの列が出るかは**確率**で決まる
* 分布を知るには、**同じ回路を何千回も**流して頻度を数える
  * ショットが多いほど頻度のばらつきは小さい
* 実機は**ショット単位で課金**される

</div>

<div class="highlight-box">

返ってくるのは**分布からのサンプル**。分布はショットを重ねてはじめて見える

</div>

---

### 重ね合わせと干渉

<div class="simple-box">

* $n$ 個の qubit で、$2^n$ 通りの入力の重ね合わせを**まとめて**扱える
* ただし測ると**答えは 1 つだけ**
  * 「全部同時に計算して全部読む」わけではない
* 振幅は波のように**干渉**する
  * 正解が強め合い、不正解が打ち消し合うように組む

</div>

<div class="highlight-box">

* この解き方が効く問題は限られている
* 一番有名なのが素因数分解の **Shor のアルゴリズム** (1994 年)

</div>

## Shor のアルゴリズム
### 因数分解を「周期探し」に言い換える

---

### 7 を掛けて 15 で割り続ける

<div class="simple-box nowrap-table">

* 15 と共通の約数を持たない数を選ぶ (今回は **7**)
* $7^x$ を 15 で割った余り ($7^x \bmod 15$) を計算する
  * 次の余りは「前の余り × 7」の余り ($4 \times 7 = 28$ → 13)

<table>
  <thead>
    <tr><th>$x$</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>
  </thead>
  <tbody>
    <tr><td>$7^x$</td><td>1</td><td>7</td><td>49</td><td>343</td><td>2401</td><td>16807</td><td>117649</td></tr>
    <tr><td>15 で割った余り</td><td><strong>1</strong></td><td>7</td><td>4</td><td>13</td><td><strong>1</strong></td><td>7</td><td>4</td></tr>
  </tbody>
</table>

</div>

<div class="highlight-box">

余りは 1 → 7 → 4 → 13 → 1 → … と **4 つごとに繰り返す**。この長さを**周期** $r$ と呼ぶ ($r = 4$)

</div>

---

### 隠れた周期を探す

<img src="assets/images/wiki/03_modular_period.png" height="400px">

<div class="highlight-box">

因数分解の問題は、この**周期を見つける問題**に言い換えられる (次のスライドから)

</div>

---

### 周期から「掛け算の形」を作る

<div class="simple-box">

* 周期が 4 → $7^4$ を 15 で割った余りは 1
* つまり $7^4 - 1 = 2400$ は **15 で割り切れる** ($2400 = 15 \times 160$)
* 中学で習う因数分解 $A^2 - 1 = (A - 1)(A + 1)$ を、$A = 7^2 = 49$ で使う

$$ 7^4 - 1 = (7^2 - 1)(7^2 + 1) = 48 \times 50 $$

</div>

<div class="highlight-box">

15 の倍数を、**2 つの数の掛け算**に分けられた

</div>

---

### 48 も 50 も 15 の倍数ではない

<div class="simple-box">

* $48 \times 50$ は 15 の倍数。でも 48 も 50 も**単独では違う**
* → 15 の素因数が 48 と 50 に**分かれて**いる
  * 実際 $48 = 3 \times 16$、$50 = 5 \times 10$
* **最大公約数** (gcd) で取り出す

$$ \gcd(48,\ 15) = 3, \qquad \gcd(50,\ 15) = 5 $$

</div>

<div class="highlight-box">

15 の素因数を知らなくても、**最大公約数を計算するだけ**で取り出せる

</div>

---

### 最大公約数は一瞬で計算できる

<div class="simple-box">

* **ユークリッドの互除法**: 割り算の余りを取り続けるだけ。600 桁でも一瞬 → $O(\log \min(a, b))$
  * $50 = 3 \times 15 + 5$、$15 = 3 \times 5$ → gcd は **5**
  * $48 = 3 \times 15 + 3$、$15 = 5 \times 3$ → gcd は **3**
* 周期が奇数のときや片方が 15 の倍数のときは失敗
  * → 7 以外の数で**やり直す** (適当に選べば半分以上の確率で成功)

</div>

<div class="highlight-box">

* 難しいのは**周期を見つける**ところ
  * (理想的な)量子コンピュータはこれが得意

</div>

### 指数を入れる箱

<div class="figure-crop" style="aspect-ratio: 1984 / 432;"><img src="assets/images/wiki/02_quantum_circuit.png" style="margin-top: -7.06%;"></div>

<div class="simple-box">

* **count** (8 qubit、図の上の線): 指数 $x$ を入れる
  * 8 qubit で 0〜255 の 256 通り
* H → 掛け算のスイッチ → 逆 QFT → **ここを測る**
* count / work は実装での呼び名 (教科書では第 1 / 第 2 レジスタ)

### 余りを書く箱

<div class="figure-crop" style="aspect-ratio: 1984 / 432;"><img src="assets/images/wiki/02_quantum_circuit.png" style="margin-top: -7.06%;"></div>

<div class="simple-box">

* **work** (4 qubit、図の下の線): 余り $7^x \bmod 15$ を書く。最初は 1
* 余りで $x$ を消すと逆回しできない → **別の箱**へ
* 2 つの箱の状態は (count, work) の**表**。各マスに**振幅**が乗り、測ると **1 マス**だけ出る

</div>

<div class="highlight-box">

量子の仕事: **どのマスを引いても役立つ表**に整える

</div>

### ステップ 2: 重ね合わせ

<div class="figure-crop" style="aspect-ratio: 2088 / 311;"><img src="assets/images/wiki/04_quantum_state_evolution.png" style="margin-top: -6.42%;"></div>

<p class="caption">横: count の値 $x$ (0〜255)、縦: work の値 (使わない 12 行は省略)。明るいほど確率が高い</p>

<div class="simple-box">

* count の 8 qubit に H ゲートを 1 個ずつ
* work = 1 の行の **256 マスに同じ振幅** (確率 1/256)
  * いま測ると 0〜255 のどれかが均等に出る

</div>

<div class="highlight-box">

* 古典: 256 通り並べるには 256 回か 256 台
* 量子: **ゲート 8 個**で 256 マス。1 qubit 足すと 2 倍

</div>

### ステップ 3: べき乗の余り

<div class="figure-crop" style="aspect-ratio: 2088 / 310; width: 90%; margin: 10px auto;"><img src="assets/images/wiki/04_quantum_state_evolution.png" style="margin-top: -28.35%;"></div>

<div class="simple-box">

* count の各 qubit を**スイッチ**に、work へ $7, 7^2, 7^4, \dots$ を掛ける
* 各マスが余りの行へ → **ずれた 4 つおきの縞**
* 2 つの箱の状態を**別々に言えない** → **エンタングルメント**

</div>

<div class="highlight-box">

いま測っても ($x$, 余り) の組が 1 つ出るだけ。**古典で計算したのと同じ**

</div>

### ステップ 4: 逆フーリエ変換

<div class="figure-crop" style="aspect-ratio: 2088 / 376; width: 90%; margin: 10px auto;"><img src="assets/images/wiki/04_quantum_state_evolution.png" style="margin-top: -50.24%;"></div>

<div class="simple-box">

* count に**逆量子フーリエ変換** (逆 QFT): 縞の「間隔」をピークの「位置」に変える
* 振幅が**干渉**: 0, 64, 128, 192 で強め合い、ほかは打ち消し合う
* 縞の**ずれ**は位相に逃げる → **どの行も同じ 4 列**

</div>

<div class="highlight-box">

測った値 $y = 64$ → $64 / 256 = 1/4$ → 分母の **4 が周期**

</div>

### じゃあ何を測るのか

<div class="simple-box">

* 見るのは因数ではなく、**測定結果の分布そのもの**
* 実機の分布を「理想」と「乱数」の混合とみなす

$$ p_{\mathrm{device}} \approx \lambda \cdot p_{\mathrm{ideal}} + (1 - \lambda) \cdot p_{\mathrm{uniform}} $$

* **信号残存率 $\lambda$**: 1 なら理想、0 なら乱数

</div>

<div class="highlight-box">

実機に投げる前に、**エミュレータで $\lambda$ を予測して書き残す**

## 実機に載せる
### 手掛かりとゲート数

---

### 今の量子コンピュータの制約

<div class="simple-box">

* **ゲートを掛けるたびに誤る**
  * 2 qubit ゲート 1 回で約 0.3〜2% (候補の 3 機)
* **隣どうしの qubit にしか 2 qubit ゲートを掛けられない** (超伝導の格子型)
* 教科書どおりの掛け算回路は、15 相手でも**数千ゲート**

</div>

<br>

<div class="highlight-box">

誤りが積もると、残る信号は $e^{-10} \approx 5 \times 10^{-5}$ 程度。**乱数と区別できない**

</div>

---

### 手掛かり①: $15 = 2^4 - 1$

<div class="simple-box">

* 4 ビットの数を 2 倍して 15 で割った余り = **ビットを 1 つ左に回すだけ**
  * あふれた最上位ビットが最下位に戻る ($15 = 1111_2$)
* 7 倍は「3 ビット回して、全ビット反転」
  * 例: $0001 \to 1000 \to 0111$ (1 × 7 = 7)
* 掛け算が**ビットの入れ替えと反転だけ**で書ける

</div>

<div class="highlight-box">

数千ゲート → **2 qubit ゲート 46 個**。ただし **15 にしか使えない**専用回路

</div>

---

### 手掛かり②: 精度を切り詰める

<img src="assets/images/wiki/n15_01_logical_circuit.png" height="280px">

<div class="highlight-box">

* count を **2 qubit** に (教科書の推奨は 9)。合計 **6 qubit**
  * 「周期は 4 以下」と知っているからできる選択
* 手掛かりを 2 つ使った以上、**この実験は「因数分解」ではない**

</div>

---

### 格子に載せると回路が倍になる

<img src="assets/images/wiki/n15_02_layout_garnet.png" height="330px">

<div class="highlight-box">

* IQM Garnet (左が今回の回路)。ゲートは**線で結ばれた隣どうしだけ**
* 離れた qubit は入れ替えて運ぶ → 2 qubit ゲート **46 → 88 個**

</div>

---

### 残る信号を事前に見積もる

<img src="assets/images/wiki/n15_07_budget_vs_signal.png" height="370px">

<div class="simple-box">

* 回路が使う全ゲートの誤り率の合計 = **誤り予算 $B$**
* 残る信号はおよそ $\lambda \approx e^{-B}$

</div>

### T1 と T2: 量子ビットの「寿命」

<div class="simple-box">

* **T1 (エネルギー緩和)**: $\lvert 1 \rangle$ が $\lvert 0 \rangle$ に落ちるまでの時間
* **T2 (位相緩和)**: 重ね合わせの**位相**が乱れるまでの時間
  * NMR の縦緩和・横緩和と同じ概念
* 今回使った qubit の T2 は **5.6〜28 µs**
* 回路全体は**約 6〜11 µs** (ゲート時間は仮定)

</div>

<div class="highlight-box">

ゲートを受けずに**待っている qubit** が、待っているあいだに崩れていく

</div>

## 一番大事な気づき
### 測っていたのは「量子らしさ」ではなかった

---

### この数字は何を測っていたのか

<div class="simple-box nowrap-table">

<table>
  <thead>
    <tr><th>count の値 $x$</th><th>0</th><th>1</th><th>2</th><th>3</th></tr>
  </thead>
  <tbody>
    <tr><td>掛け算のあとの work</td><td>1</td><td>7</td><td>4</td><td>13</td></tr>
  </tbody>
</table>

* count 2 qubit では、work の値が**全部違う**
* work が $x$ を記録している = **どのスリットを通ったか分かる**二重スリット
* 理想の分布は、**count を途中で測った場合とまったく同じ**

</div>

<div class="highlight-box">

count の重ね合わせが壊れていても**同じ分布**が出る。
$\lambda$ が見ていたのは**掛け算回路の出来**だけ

</div>

---

### 15 という数の特殊性

<div class="simple-box">

* 15 を法とする周期は **1, 2, 4 だけ** — 全部 2 のべき
* 2 のべきの周期は、2 進数の count で**ぴったり割り切れる**
  * 干渉で「惜しい値を打ち消す」出番がない
* 干渉を見るには、周期が 2 のべきでない数が要る
  * 例: $N = 21$ (底 2 の周期は 6)

</div>

<br>

<div class="highlight-box">

「15 の因数分解」は、量子アルゴリズムの検証としては**甘い問題**だった

</div>

---

### 追加実験: 位相は保たれているか

<div class="simple-box">

* 増やした 1 qubit は、重ね合わせのまま**待機するだけ**
* 位相を保てていれば、測定値は**偶数だけ** (0, 2, 4, 6)
* 位相が壊れていれば、奇数も同じだけ出る
* **可視度** = 偶数の割合 − 奇数の割合 (理想 1、壊れると 0)

</div>

<div class="highlight-box">

事前の予測: エミュレータ **0.83** / 待機の減衰を足すと **0.25〜0.42**

</div>

---

### 結果: 奇数がほぼ同じだけ出た

<img src="assets/images/garnet_t3_y_marginal.svg" height="440px" style="box-shadow: none;border:none;">

<p class="caption">青: 理想 (偶数だけ) / 緑: エミュレータの予測 / 橙: 実機 (同日、3000 ショット、4.65 USD)</p>

---

### どちらの予測も外れた

<img src="assets/images/garnet_t3_visibility.svg" height="300px" style="box-shadow: none;border:none;">

<div class="simple-box">

* 可視度 **0.087 ± 0.018**
* 待機していた qubit は、回路のあいだに**ほぼ完全に位相を失った**

</div>

---

### 何が起きていたのか

<div class="simple-box">

1. **置き場所が悪かった**
   * 待機 qubit は、8 個のうち **T2 が最短 (5.6 µs)** の場所にいた
   * 自作の配置プログラムはゲートの誤り率しか見ていなかった
2. **それでも予測 (0.25) より悪い**
   * 候補: **隣の qubit で動くゲートが位相を乱す** (未検証)

</div>

<div class="highlight-box">

カタログ値の T2 は、動いている回路の中での**上限**でしかない

</div>

### Appendix 1: 信号残存率の求め方

<div class="simple-box">

$$ \lambda = \frac{m - f}{1 - f} $$

* $m$: 測定結果が「理想で確率を持つマス」に乗った割合
* $f$: そのマスが全体に占める割合
* 本測定: $m = 0.454$、$f = 16/64$ → $\lambda = 0.272$

</div>

* 片方の gcd から出る 2 は「6 は偶数」と同じ情報
